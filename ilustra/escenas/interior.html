<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Ilustra — Interior cálido</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head><body><canvas id="lienzo" width="1080" height="1920"></canvas>
<script src="../src/nucleo.js"></script>
<script src="../src/pincel.js"></script>
<script src="../src/luz.js"></script>
<script src="../src/atmosfera.js"></script>
<script src="../src/camara.js"></script>
<script src="../src/esqueleto.js"></script>
<script src="../src/personaje.js"></script>
<script src="../src/props.js"></script>
<script src="../src/escenarios.js"></script>
<script src="../src/elipsis.js"></script>
<script src="../src/escena.js"></script>
<script>
// Escena de 10 s: Tomás, junto a la ventana en una noche de lluvia, alcanza su taza (IK de la mano) y la acerca al pecho.
// Su sombra se proyecta en la pared (recurso de elipsis).
const I = Ilustra;
const esc = I.escenarios.interiorCalido({ taza: false });
const H = 500, SUELO = esc.suelo, SUP = SUELO + 40 - 230;
const tomas = new I.Personaje({
  nombre: 'Tomás', tipo: 'anciano', altura: H, semilla: 23, piel: '#dba886', pelo: '#c4bdb3', peinado: 'corto', ojos: '#2f2a28',
  abrigo: { color: '#5f6b5a', largo: 0.42, cuello: false }, bufanda: null, pantalon: '#4a4440', zapatos: '#2e2622'
});
const X = 380, TAZA0 = [655, SUP];
function estado(t) {
  // 0-3 s mira por la ventana; 3-4.6 s alcanza la taza; 4.6-6.4 s la lleva al pecho; después la sostiene
  const alcanzar = I.suave(I.clamp((t - 3) / 1.6, 0, 1));
  const llevar = I.suave(I.clamp((t - 4.8) / 1.6, 0, 1));
  const base = I.mezclarPoses(I.POSES.dePie, I.POSES.agarrar, alcanzar * (1 - llevar) * 0.8);
  base.cabeza = I.lerp(-0.12, 0.2, alcanzar) - 0.18 * llevar; base.cuello = I.lerp(0, 0.1, alcanzar) - 0.06 * llevar;
  const mano = [I.lerp(I.lerp(X + 60, TAZA0[0] - 10, alcanzar), X + 105, llevar), I.lerp(I.lerp(SUELO - H * 0.45, TAZA0[1] - 30, alcanzar), SUELO - H * 0.6, llevar)];
  const pose = Object.assign({}, base, { objetivoManoD: mano });
  const expresion = I.mezclarExpresiones(I.mezclarExpresiones('pensativa', 'neutra', alcanzar), 'ternura', I.suave(I.clamp((t - 6.2) / 1, 0, 1)));
  return { x: X, y: SUELO, dir: 1, pose, expresion, mirada: [0.6 - 0.4 * alcanzar, -0.25 + 0.5 * alcanzar * (1 - llevar)], viento: 0.05, mano };
}
const actor = {
  personaje: tomas, estado,
  antes(ctx, t, est) { I.elipsis.sombraProyectada(ctx, c => tomas.dibujar(c, t, Object.assign({}, est, { sombraSuelo: false })), { ancla: [est.x, est.y - 2], sesgo: -0.42, escalaY: 1.0, alfa: 0.38, desenfoque: 6, color: '#2a1a14' }); },
  despues(ctx, t, est) {
    const J = tomas.ultimas, cog = t > 4.6;
    const p = cog ? [J.dedosD.x + 4, J.dedosD.y + 30] : TAZA0;
    I.props.taza(ctx, p[0], p[1], { t, semilla: 18, escala: 1.05 });
    if (cog) tomas.brazo(ctx, { t, e: est, J, H, dir: 1, s: 23 }, 'D', false); // la mano queda delante del asa
  }
};
const cam = new I.Camara({ temblor: 0.5, claves: { x: [[0, 500], [10, 470]], zoom: [[0, 1.3], [10, 1.42]], y: [[0, 900], [10, 880]] } });
const escena = new I.Escena({ escenario: esc, camara: cam, duracion: 10, fps: 30, actores: [actor],
  post: { lluvia: false, grano: 0.05, vineta: 0.55, gradacion: { fuerza: 0.08, sombras: '#3a2a30', luces: '#ffd29a' } } });
I.montar(escena);
</script></body></html>
