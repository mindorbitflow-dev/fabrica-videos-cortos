<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Ilustra F2 — Personaje2 giro de 360°</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
</head><body><canvas id="lienzo" width="1080" height="1920"></canvas>
<script src="../src/nucleo.js"></script>
<script src="../src/geom3.js"></script>
<script src="../src/pincel.js"></script>
<script src="../src/pintura.js"></script>
<script src="../src/luz.js"></script>
<script src="../src/atmosfera.js"></script>
<script src="../src/camara.js"></script>
<script src="../src/esqueleto.js"></script>
<script src="../src/rig25.js"></script>
<script src="../src/dinamica.js"></script>
<script src="../src/personaje.js"></script>
<script src="../src/mano.js"></script>
<script src="../src/cuerpo.js"></script>
<script src="../src/ropa.js"></script>
<script src="../src/cabeza25.js"></script>
<script src="../src/pelo.js"></script>
<script src="../src/personaje2.js"></script>
<script src="../src/props.js"></script>
<script src="../src/escenarios.js"></script>
<script src="../src/elipsis.js"></script>
<script src="../src/escena.js"></script>
<script>
// WP7 (criterio V1): Lía y Teo (Personaje2, modo pintado) lado a lado sobre una peana, girando 360° en 8 s: yaw = t·π/4 (t = 0..7 da 0, 45°, ..., 315°).
// Quietos y con respiración; el pelo y la bufanda tienen viento suave. ?modo=vector para verlos en vector.
const I = Ilustra, q = new URLSearchParams(location.search);
I.MODO = q.get('modo') || 'pintado';
const H = 520, Y = 1180;
const luz = new I.Luz({ dir: [-0.6, -0.8], dirBorde: [0.85, -0.35], clave: '#ffd8a8', ambiente: '#56657e', borde: '#ffc98a', niebla: '#8996aa' });
const lia = new I.Personaje2({ preset: 'lia', altura: H }), teo = new I.Personaje2({ preset: 'teo', altura: H });
const estadoDe = (x, fase) => function estado(t) { return { x, y: Y, yaw: t * Math.PI / 4 + fase, viento: 0.25, luz, _estadoEn: estado }; };
const esc = { luz, fondo: '#a9b0bb', suelo: Y, capas: [
  { z: 3, dibujar(ctx) {                                                       // telón: degradado cálido-frío y juntas del suelo
    const g = ctx.createLinearGradient(0, 0, 0, Y); g.addColorStop(0, '#b9c0cc'); g.addColorStop(1, '#8e97a7'); ctx.fillStyle = g; ctx.fillRect(-200, -200, 1500, Y + 200);
    const s = ctx.createLinearGradient(0, Y, 0, 1920); s.addColorStop(0, '#6f7787'); s.addColorStop(1, '#4b5262'); ctx.fillStyle = s; ctx.fillRect(-200, Y, 1500, 900);
  } },
  { actores: true }
] };
const escena = new I.Escena({ escenario: esc, camara: new I.Camara({ temblor: 0 }), duracion: 8, fps: 30,
  actores: [{ personaje: lia, estado: estadoDe(300, 0) }, { personaje: teo, estado: estadoDe(780, 0) }], post: { lluvia: false, bloom: false, grano: 0.04, vineta: 0.3, gradacion: { fuerza: 0.05 } } });
const dibujar = escena.draw; escena.draw = function (ctx, t) { I.dinamica.vaciarCache(); return dibujar.call(this, ctx, t); };   // cabo 3: lo hará Escena.draw (WP8)
I.montar(escena);
</script></body></html>
