  voz: "gemini:Fenrir"
  estilo: video
  cta: Sígueme para entender el mundo en un minuto.
  paleta: {fondo: ["#1f1147", "#120a2e", "#07040f"], acento: "#00E5FF", principal: "#B388FF", secundario: "#00E5FF", peligro: "#FF4D6D", ok: "#69F0AE"}
  ideas:
    - Por qué el cielo es azul
    - Por qué el mar es salado
    - Cómo se forma un rayo
    - Por qué el hielo flota
    - Cómo funciona un arcoíris
    - Por qué vemos la Luna de día
    - Por qué las nubes no se caen
    - Cómo funciona la fotosíntesis

