# Nichos de la fábrica. Voces: gemini:Puck, gemini:Fenrir, gemini:Achird, en-US-BrianMultilingualNeural
# (o cualquier voz de Edge-TTS). Puedes editarlos aquí o en la pestaña 🧭 Nichos.
# estilo: video (clips reales de Pexels + portada y subtítulos), plano (diagramas animados),
#         ilustracion (diagramas con fondo cálido y grano) o tipografia (texto grande + ícono).
# paleta: colores del fondo (centro, medio, borde), acento (títulos y palabra resaltada)
#         y colores que la IA usa para dibujar (principal, secundario, peligro, ok).

biologia:
  nombre: 🧬 Biología que no te contaron
  descripcion: Datos reales del cuerpo y los animales que contradicen lo que la gente cree, con giro sorprendente.
  tono: Directo y sorprendente desde la primera frase, frases cortas, revela el giro rápido y lo explica simple.
  voz: "gemini:Fenrir"
  estilo: video
  cta: Sígueme para más biología que no te contaron.
  paleta: {fondo: ["#3b2a24", "#221713", "#0d0907"], acento: "#5BE37D", principal: "#E8B18F", secundario: "#B5654B", peligro: "#D64545", ok: "#5BE37D"}
  ideas:
    - Por qué los flamencos son rosados si nacen grises
    - El pulpo tiene tres corazones y sangre azul
    - Tu cerebro no siente dolor
    - Los delfines duermen con medio cerebro
    - Las uñas no siguen creciendo después de morir
    - Los murciélagos no son ciegos
    - Los tiburones existen desde antes que los árboles
    - Los gatos no pueden saborear lo dulce
    - En los caballitos de mar el macho lleva las crías
    - Las abejas bailan para indicar dónde hay flores

cotidiano:
  nombre: 🏠 Cosas de todos los días
  descripcion: Objetos y detalles cotidianos que todos ven y nadie sabe para qué sirven.
  tono: Curioso, cercano, con sorpresa en el gancho y explicación clara paso a paso.
  voz: "gemini:Puck"
  estilo: video
  cta: Sígueme para más cosas que ves todos los días y nadie te explica.
  paleta: {fondo: ["#12305a", "#0a1628", "#05080f"], acento: "#FFD23F", principal: "#7FD1FF", secundario: "#3BA7FF", peligro: "#e63946", ok: "#2ecc71"}
  ideas:
    - El agujero en la tapa de los bolígrafos
    - Por qué los enchufes tienen agujeros en las patas
    - El bolsillo pequeño de los jeans
    - Por qué las teclas F y J tienen una rayita
    - Los números en el fondo de las botellas de plástico
    - Por qué los aviones tienen ventanas redondas
    - Para qué sirve el agujero de las ollas
    - Por qué los semáforos son rojo, amarillo y verde

