# Nichos de la fábrica. Voces: gemini:Puck, gemini:Fenrir, gemini:Achird, en-US-BrianMultilingualNeural
# (o cualquier voz de Edge-TTS). Puedes editarlos aquí o en la pestaña 🧭 Nichos.
# cierre: frase final que pide seguir la página (la última escena la agrega el código, no la IA).
# estilo: plano (diagramas sobre cuadrícula) o ilustracion (diagramas sobre fondo cálido con grano).
# formato: historia = Tito pregunta y Sombra revela el origen; marca: capa de marca (assets/marca/<marca>.jpg); estilo_voz: cómo narra Gemini.
# auto: false = no entra en la rotación automática de GitHub (se puede usar a mano desde la app o con --nicho).
# paleta: colores del fondo (centro, medio, borde), acento (títulos y palabra resaltada)
#         y colores que la IA usa para dibujar (principal, secundario, peligro, ok).

evidencia:
  nombre: 🔍 Sombra de Evidencia
  descripcion: El cerdito Tito llega con algo cotidiano y el detective Sombra le revela el origen oculto que casi nadie conoce. Historias reales y documentadas de negocios, publicidad, dinero y psicología, contadas como una conspiración.
  tono: Intriga de "esto te lo ocultaron", ritmo rápido, datos concretos (años, nombres, cifras) y una lección final del detective. Todo verificable.
  formato: historia   # Tito pregunta, Sombra revela el origen con un flashback (reglas en .claude/commands/video.md)
  marca: sombra       # portada serif y cierre con el logo (assets/marca/sombra.jpg)
  voz: "gemini:Charon"
  estilo: ilustracion
  cierre: "Síguenos: cada sombra tiene su evidencia."
  lema: "Cada sombra tiene su evidencia"
  paleta: {fondo: ["#1b1916", "#0f0e0c", "#050505"], acento: "#D4B47A", principal: "#efe7d6", secundario: "#8a8278", peligro: "#C2503A", ok: "#D4B47A"}
  ideas:
    - Tu anillo de diamante es publicidad - De Beers y "un diamante es para siempre"
    - Por qué los focos se funden - el cártel Phoebus y las 1000 horas
    - El desayuno con huevos y tocino lo inventó un publicista - Edward Bernays
    - Las "antorchas de la libertad" - cómo convencieron a las mujeres de fumar en 1929
    - La industria del azúcar pagó a científicos para culpar a la grasa (1967)
    - Por qué la leche siempre está al fondo del supermercado
    - Los casinos no tienen relojes ni ventanas
    - Por qué los precios terminan en 99
    - La impresora barata y la tinta carísima - el modelo de la cuchilla de Gillette
    - Por qué el agua embotellada cuesta más que la gasolina
    - Menos producto por el mismo precio - la reduflación
    - Las apps gratis no son gratis - tú eres el producto
    - Por qué es tan difícil cancelar una suscripción - los patrones oscuros
    - El plato caro del menú que nadie pide - el efecto ancla
    - Los dulces junto a la caja del supermercado
    - Apple y los iPhone que se volvían lentos (2017)
    - La fiebre de los tulipanes - la primera burbuja financiera (1637)
    - Por qué los cereales infantiles tienen la mascota mirando hacia abajo
    - El olor a pan recién hecho en el supermercado
    - Las tarjetas de puntos y millas - por qué te las regalan
    - McDonald's gana más con terrenos que con hamburguesas
    - Por qué los supermercados cambian los productos de lugar
    - Monopoly nació como una crítica a los monopolios
    - El primer "Black Friday" y por qué se llama así
    - Por qué la música de las tiendas es lenta

biologia:
  nombre: 🧬 Biología que no te contaron
  descripcion: Datos reales del cuerpo y los animales que contradicen lo que la gente cree, con giro sorprendente.
  tono: Directo y sorprendente desde la primera frase, frases cortas, revela el giro rápido y lo explica simple.
  voz: "gemini:Fenrir"
  auto: false   # desde 2026-11-10 el automático fabrica solo misterios (marca Sombra de Evidencia)
  estilo: ilustracion
  cierre: "Síguenos para más biología."
  paleta: {fondo: ["#3b2a24", "#221713", "#0d0907"], acento: "#5BE37D", principal: "#E8B18F", secundario: "#B5654B", peligro: "#D64545", ok: "#5BE37D"}
  ideas:
    - Por qué los flamencos son rosados si nacen grises
    - El pulpo tiene tres corazones y sangre azul
    - Tu cerebro no siente dolor
    - Los delfines duermen con medio cerebro
    - Las uñas no siguen creciendo después de morir
    - Los murciélagos no son ciegos
    - Los tiburones existen desde antes que los árboles
    - Los gatos no pueden saborear lo dulce
    - En los caballitos de mar el macho lleva las crías
    - Las abejas bailan para indicar dónde hay flores

