# Nichos de la fábrica. Voces: gemini:Puck, gemini:Fenrir, gemini:Achird, en-US-BrianMultilingualNeural
# (o cualquier voz de Edge-TTS). Puedes editarlos aquí o en la pestaña 🧭 Nichos.
# cierre: frase final que pide seguir la página (la última escena la agrega el código, no la IA).
# estilo: plano (diagramas sobre cuadrícula) o ilustracion (diagramas sobre fondo cálido con grano).
# formato: historia = Tito pregunta y Sombra revela el origen; marca: capa de marca (assets/marca/<marca>.jpg); estilo_voz: cómo narra Gemini.
# auto: false = no entra en la rotación automática de GitHub (se puede usar a mano desde la app o con --nicho).
# paleta: colores del fondo (centro, medio, borde), acento (títulos y palabra resaltada)
#         y colores que la IA usa para dibujar (principal, secundario, peligro, ok).

evidencia:
  nombre: 🔍 Sombra de Evidencia
  descripcion: El cerdito Tito llega con algo cotidiano y el detective Sombra le revela el origen oculto que casi nadie conoce. Historias reales y documentadas de negocios, publicidad, dinero y psicología, contadas como una conspiración.
  tono: Intriga de "esto te lo ocultaron", ritmo rápido, datos concretos (años, nombres, cifras) y una lección final del detective. Todo verificable.
  formato: historia   # Tito pregunta, Sombra revela el origen con un flashback (reglas en .claude/commands/video.md)
  marca: sombra       # portada serif y cierre con el logo (assets/marca/sombra.jpg)
  voz: "gemini:Charon"
  estilo: ilustracion
  post: false         # sin el post de dos cuadros (viñeta Tito/Sombra) ni su correo aparte; quita la línea para reactivarlo
  personajes: ilustra   # Sombra y Tito con el kit de ilustración (plantilla/ilustra.js); quita esta línea para volver a la caricatura
  cierre: "Síguenos: cada sombra tiene su evidencia."   # no se usa en el video: el final es la pregunta (final: pregunta)
  temas: libre        # Claude elige cada tema (cotidiano o del momento) pensando en viralidad; la lista es solo de ejemplo
  herramientas: "WebSearch,WebFetch"   # para confirmar temas del momento
  final: pregunta     # la última escena es una pregunta para comentar; la marca la pone en grande con el logo
  portada_en_video: false   # sin título al empezar: el video arranca directo en el gancho
  lema: "Cada sombra tiene su evidencia"
  paleta: {fondo: ["#3d4a5c", "#232c3a", "#12171f"], acento: "#E0B060", principal: "#E7DCC2", secundario: "#9AA7B8", peligro: "#B5654A", ok: "#7D9A7A"}
  ideas:
    # en orden: de más a menos viral (la fábrica toma la primera que no se haya usado)
    - McDonald's gana más con terrenos que con hamburguesas
    - La bóveda de Disney - escondían sus películas para que las compraras con prisa
    - Apple y los iPhone que se volvían lentos (2017)
    - Coca-Cola y Santa Claus - lo que sí y lo que no inventaron sus anuncios de 1931
    - Las máquinas de peluches están programadas para que casi nunca ganes
    - El botón de cerrar puertas del ascensor muchas veces no hace nada
    - Los botones del semáforo peatonal que no hacen nada - el caso de Nueva York
    - Amazon Prime y el laberinto para cancelarlo - la demanda del gobierno de Estados Unidos
    - Las palomitas del cine - donde el cine gana de verdad
    - Por qué las aerolíneas venden más boletos que asientos
    - El desayuno con huevos y tocino lo inventó un publicista - Edward Bernays
    - Los gimnasios ganan más con los que nunca van
    - La creadora del Día de la Madre pasó su vida intentando eliminarlo - Anna Jarvis
    - El inventor del scroll infinito se arrepintió de crearlo
    - Las "antorchas de la libertad" - cómo convencieron a las mujeres de fumar en 1929
    - Por qué los focos se funden - el cártel Phoebus y las 1000 horas
    - La impresora barata y la tinta carísima - el modelo de la cuchilla de Gillette
    - Black Friday - muchas ofertas cuestan lo mismo o menos otros días del año
    - Las fechas de "consumir preferentemente" que te hacen botar comida buena
    - Los casinos no tienen relojes ni ventanas
    - Por qué la leche siempre está al fondo del supermercado
    - Por qué los precios terminan en 99
    - Las apps gratis no son gratis - tú eres el producto
    - Por qué es tan difícil cancelar una suscripción - los patrones oscuros
    - Menos producto por el mismo precio - la reduflación
    - Monopoly nació como una crítica a los monopolios
    - Los dulces junto a la caja del supermercado
    - El olor a pan recién hecho en el supermercado
    - La fiebre de los tulipanes - la primera burbuja financiera (1637)
    - El primer "Black Friday" y por qué se llama así
    - Por qué la música de las tiendas es lenta
    - Tu anillo de diamante es publicidad - De Beers y "un diamante es para siempre"
    - La industria del azúcar pagó a científicos para culpar a la grasa (1967)
    - Por qué el agua embotellada cuesta más que la gasolina
    - El plato caro del menú que nadie pide - el efecto ancla
    - Por qué los cereales infantiles tienen la mascota mirando hacia abajo
    - Las tarjetas de puntos y millas - por qué te las regalan
    - Por qué los supermercados cambian los productos de lugar

taller:
  nombre: 🔧 Así se fabrica
  descripcion: Cualquier objeto, electrodoméstico o máquina se desarma y se vuelve a armar en un taller ilustrado en 2D (luz cálida, colores apagados); cada pieza aparece porque sin ella algo falla a la vista.
  tono: Casual y con humor, como un amigo que arma la máquina contigo. Frases cortas; cada falla es un chiste visual y cada pieza la arregla. Física real, sin mitos.
  formato: construccion   # empieza terminado → lo mínimo → falla → pieza que lo arregla → terminado (reglas en .claude/commands/video.md)
  motor: 2d               # escenas 2D con el motor de ilustración (plantilla/taller2d.js: W2)
  libs2d: [taller2d.js]   # scripts del motor 2D tras kit.js e ilustra.js
  final: pregunta         # la última escena es una pregunta para comentar
  voz: "gemini:Puck"
  auto: true              # en la rotación automática, alternando con Evidencia (aprobado 2026-11-14)
  temas: libre            # Claude elige cada tema pensando en viralidad; la lista de ideas es solo de ejemplo
  modelo: sonnet          # modelo de Claude Code para este nicho: gasta menos del límite del plan que Opus
  comando: video-taller   # reglas propias y cortas (.claude/commands/video-taller.md): menos tokens en cada paso
  subtitulos: arriba      # subtítulos arriba (y=170-400), planos, sin borde ni relieve
  portada_en_video: false # sin título al empezar: el video arranca directo en el gancho
  estilo: ilustracion
  cierre: "Síguenos para armar la próxima máquina."
  lema: "Así se fabrica"
  paleta: {fondo: ["#586674", "#343e4b", "#1d2230"], acento: "#E0B060", principal: "#E0B060", secundario: "#8E99A6", peligro: "#B5473F", ok: "#6F9C6A"}
  ideas:
    # objetos, electrodomésticos y máquinas: la fábrica toma una al azar entre las que no se han hecho; al acabarse, Claude elige temas nuevos
    - La licuadora
    - El inodoro
    - La nevera
    - El microondas
    - El bombillo
    - La olla a presión
    - El candado
    - La cremallera
    - La bicicleta
    - El helicóptero
    - La lavadora
    - El paraguas
    - El secador de pelo
    - La tostadora
    - El ventilador
    - El cohete
    - El paracaídas
    - La cafetera
    - El extintor
    - La motosierra
    - El submarino
    - La grúa
    - El ascensor
    - El dron

sobrevive:
  nombre: 🆘 ¿Sobrevivirías?
  descripcion: Situaciones extremas en segunda persona (un ascensor que cae, un rayo, hielo que se rompe, una corriente que te arrastra) en 2D ilustrado con una persona; lo que casi todos harían falla y lo que de verdad te salva, con física real.
  tono: Directo y con tensión, en segunda persona ("tú"), frases cortas. Primero el miedo, luego el mito que falla y al final la respuesta que salva. Consejos correctos según rescatistas y física; nada de sangre ni heridas.
  formato: supervivencia  # situación → dilema → el mito falla → lo que te salva → caso real → instrucción corta (reglas en .claude/commands/video-sobrevive.md)
  motor: 2d               # escenas con plantilla/sobrevive2d.js (global V) sobre el kit Ilustra
  libs2d: [fauna2d.js, sobrevive2d.js]
  comando: video-sobrevive
  temas: libre            # Claude elige cada tema pensando en viralidad; la lista de ideas es solo de ejemplo
  modelo: sonnet
  final: pregunta
  subtitulos: arriba      # subtítulos arriba, planos, sin borde ni relieve (letras blancas: escenas más oscuras)
  portada_en_video: false # arranca directo en el gancho
  voz: "gemini:Charon"
  auto: true              # activo desde 2026-11-15
  estilo: ilustracion
  cierre: "¿Tú qué habrías hecho? Escríbelo en los comentarios."
  lema: "¿Sobrevivirías?"
  paleta: {fondo: ["#1b222c", "#262f3b", "#34404f"], acento: "#E0B060", principal: "#EFE6D2", secundario: "#4F6D8F", peligro: "#C9584C", ok: "#6FA66E"}
  ideas:
    # situaciones extremas reales: la fábrica toma una al azar entre las que no se han hecho; al acabarse, Claude elige otras
    - El ascensor que se suelta
    - Te cae un rayo en campo abierto
    - El hielo del lago se rompe bajo tus pies
    - Una corriente de resaca te arrastra mar adentro
    - Tu carro cae a un río
    - Terremoto dentro de un edificio (el mito del triángulo de la vida)
    - Incendio en tu edificio y el pasillo lleno de humo
    - El avión pierde presión y caen las máscaras
    - Los frenos de tu carro fallan en una bajada
    - Una avalancha te alcanza esquiando
    - El mar se retira de golpe en la playa (tsunami)
    - Te atragantas comiendo y estás solo
    - Te muerde una serpiente en el campo
    - Caes al agua helada
    - Un tornado se acerca y estás en la calle
    - Te pierdes en el desierto sin agua
    - "Arenas movedizas: el mito y la verdad"
    - Te quedas encerrado en un carro bajo el sol
    - Te caes de un barco en alta mar
    - Un enjambre de abejas te persigue
    - Te pierdes en el bosque de noche
    - Te sorprende una tormenta eléctrica nadando
    - Un oso pardo te ve en el bosque
    - Un tiburón nada hacia ti en la playa
    - Un perro bravo corre hacia ti
    - Un toro te embiste en el campo
    - Un cocodrilo te agarra en la orilla del río
    - Una manada de lobos te rodea
    - Un puma te acecha en el sendero

biologia:
  nombre: 🧬 Biología que no te contaron
  descripcion: Datos reales del cuerpo y los animales que contradicen lo que la gente cree, con giro sorprendente.
  tono: Directo y sorprendente desde la primera frase, frases cortas, revela el giro rápido y lo explica simple.
  voz: "gemini:Fenrir"
  auto: false   # desde 2026-11-10 el automático fabrica solo misterios (marca Sombra de Evidencia)
  estilo: ilustracion
  cierre: "Síguenos para más biología."
  paleta: {fondo: ["#3b2a24", "#221713", "#0d0907"], acento: "#5BE37D", principal: "#E8B18F", secundario: "#B5654B", peligro: "#D64545", ok: "#5BE37D"}
  ideas:
    - Por qué los flamencos son rosados si nacen grises
    - El pulpo tiene tres corazones y sangre azul
    - Tu cerebro no siente dolor
    - Los delfines duermen con medio cerebro
    - Las uñas no siguen creciendo después de morir
    - Los murciélagos no son ciegos
    - Los tiburones existen desde antes que los árboles
    - Los gatos no pueden saborear lo dulce
    - En los caballitos de mar el macho lleva las crías
    - Las abejas bailan para indicar dónde hay flores

