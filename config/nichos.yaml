# Nichos de la fábrica. Voces: gemini:Puck, gemini:Fenrir, gemini:Achird, en-US-BrianMultilingualNeural
# (o cualquier voz de Edge-TTS). Se editan aquí.
# cierre: frase final que pide seguir la página (la última escena la agrega el código, no la IA).
# estilo: plano (diagramas sobre cuadrícula) o ilustracion (diagramas sobre fondo cálido con grano).
# formato: historia = Tito pregunta y Sombra revela el origen; marca: capa de marca (assets/marca/<marca>.jpg); estilo_voz: cómo narra Gemini.
# auto: false = no entra en la rotación automática de GitHub (se puede usar a mano con --nicho o con /video <nicho>).
# comando: reglas propias del nicho (.claude/commands/<comando>.md); personajes: ilustra = kit de ilustración (S30 y decorados D); motor: 2d = librerías de libs2d.
# cuadros_hoja: cuadros por escena en las hojas de contacto de la revisión (2 = inicio y final; por defecto 2 con motor 2d y 3 en el resto).
# paleta: colores del fondo (centro, medio, borde), acento (títulos y palabra resaltada)
#         y colores que la IA usa para dibujar (principal, secundario, peligro, ok).

evidencia:
  nombre: 🔍 Sombra de Evidencia
  descripcion: >-
    El cerdito Tito llega con algo cotidiano o con una creencia popular y el detective Sombra investiga. Dos series que alternan:
    Origen oculto (la historia real de negocios, publicidad y dinero que casi nadie conoce) y Mito vs. evidencia (Sombra pide
    pruebas y dicta si una creencia de historia o ciencia es mito, verdad o media verdad).
  tono: >-
    Intriga de detective, ritmo rápido, datos concretos (años, nombres, cifras) y una lección final de Sombra. En Origen oculto suena
    a «esto te lo ocultaron»; en Mito vs. evidencia, a curiosidad amable («vamos a ver la evidencia»). Todo verificable.
  auto: false         # desactivado el 2026-11-24 al lanzar Giro Final (a mano con --nicho evidencia); antes era la única activa desde 2026-11-22
  cuadros_hoja: 3     # inicio, mitad y final de cada escena en las hojas de revisión: así se ve el recorrido y no solo los extremos
  formato: historia   # Tito pregunta, Sombra revela el origen con un flashback (reglas en .claude/commands/video.md)
  marca: sombra       # portada serif y cierre con el logo (assets/marca/sombra.jpg)
  voz: "gemini:Charon"
  estilo: ilustracion
  post: false         # sin el post de dos cuadros (viñeta Tito/Sombra) ni su correo aparte; quita la línea para reactivarlo
  personajes: ilustra   # Sombra y Tito con el kit de ilustración (plantilla/ilustra.js); quita esta línea para volver a la caricatura
  cierre: "Síguenos: cada sombra tiene su evidencia."   # no se usa en el video: el final es la pregunta (final: pregunta)
  temas: libre        # Claude elige cada tema (cotidiano o del momento) pensando en viralidad; la lista es solo de ejemplo
  herramientas: "WebSearch,WebFetch"   # para confirmar temas del momento
  final: pregunta     # la última escena es una pregunta para comentar; la marca la pone en grande con el logo
  portada_en_video: false   # sin título al empezar: el video arranca directo en el gancho
  lema: "Cada sombra tiene su evidencia"
  paleta: {fondo: ["#3d4a5c", "#232c3a", "#12171f"], acento: "#E0B060", principal: "#E7DCC2", secundario: "#9AA7B8", peligro: "#B5654A", ok: "#7D9A7A"}
  series:
    # La fábrica alterna: cada video es de la serie que lleva más tiempo sin usarse (fabrica.serie_siguiente). Las ideas son banco de ejemplos
    # (Claude elige el tema con WebSearch y no repite). Las reglas de cada serie están en .claude/commands/video.md.
    origen:
      nombre: Origen oculto
      ideas:
        # en orden: de más a menos viral
        - McDonald's gana más con terrenos que con hamburguesas
        - La bóveda de Disney - escondían sus películas para que las compraras con prisa
        - Apple y los iPhone que se volvían lentos (2017)
        - Coca-Cola y Santa Claus - lo que sí y lo que no inventaron sus anuncios de 1931
        - Las máquinas de peluches están programadas para que casi nunca ganes
        - El botón de cerrar puertas del ascensor muchas veces no hace nada
        - Los botones del semáforo peatonal que no hacen nada - el caso de Nueva York
        - Amazon Prime y el laberinto para cancelarlo - la demanda del gobierno de Estados Unidos
        - Las palomitas del cine - donde el cine gana de verdad
        - Por qué las aerolíneas venden más boletos que asientos
        - El desayuno con huevos y tocino lo inventó un publicista - Edward Bernays
        - Los gimnasios ganan más con los que nunca van
        - La creadora del Día de la Madre pasó su vida intentando eliminarlo - Anna Jarvis
        - El inventor del scroll infinito se arrepintió de crearlo
        - Las "antorchas de la libertad" - cómo convencieron a las mujeres de fumar en 1929
        - Por qué los focos se funden - el cártel Phoebus y las 1000 horas
        - La impresora barata y la tinta carísima - el modelo de la cuchilla de Gillette
        - Black Friday - muchas ofertas cuestan lo mismo o menos otros días del año
        - Las fechas de "consumir preferentemente" que te hacen botar comida buena
        - Los casinos no tienen relojes ni ventanas
        - Por qué la leche siempre está al fondo del supermercado
        - Por qué los precios terminan en 99
        - Las apps gratis no son gratis - tú eres el producto
        - Por qué es tan difícil cancelar una suscripción - los patrones oscuros
        - Menos producto por el mismo precio - la reduflación
        - Monopoly nació como una crítica a los monopolios
        - Los dulces junto a la caja del supermercado
        - El olor a pan recién hecho en el supermercado
        - La fiebre de los tulipanes - la primera burbuja financiera (1637)
        - El primer "Black Friday" y por qué se llama así
        - Por qué la música de las tiendas es lenta
        - Tu anillo de diamante es publicidad - De Beers y "un diamante es para siempre"
        - La industria del azúcar pagó a científicos para culpar a la grasa (1967)
        - Por qué el agua embotellada cuesta más que la gasolina
        - El plato caro del menú que nadie pide - el efecto ancla
        - Por qué los cereales infantiles tienen la mascota mirando hacia abajo
        - Las tarjetas de puntos y millas - por qué te las regalan
        - Por qué los supermercados cambian los productos de lugar
    mito:
      nombre: Mito vs. evidencia
      ideas:
        - Los vikingos no usaban cascos con cuernos - el vestuario de una ópera de 1876
        - La Gran Muralla China no se ve a simple vista desde el espacio
        - Napoleón no era bajito
        - Einstein no reprobó matemáticas
        - Colón no descubrió que la Tierra era redonda - ya se sabía desde la antigua Grecia
        - Los rayos sí caen dos veces en el mismo lugar - el Empire State recibe decenas al año
        - Los toros no se enfurecen por el color rojo
        - Las avestruces no esconden la cabeza en la arena
        - Los diamantes no se forman del carbón
        - Los astronautas no flotan porque allá arriba no haya gravedad
        - En Salem no quemaron a ninguna bruja
        - Los camaleones no cambian de color solo para esconderse
        - El agua del lavabo no gira distinto en cada hemisferio
        - María Antonieta nunca dijo "que coman pasteles"
        - Los romanos no vomitaban para seguir comiendo - qué era el vomitorium
        - Los piratas casi nunca hacían caminar a nadie por la tabla

sobrevive:
  nombre: 🆘 ¿Sobrevivirías?
  descripcion: Situaciones extremas en segunda persona (un ascensor que cae, un rayo, hielo que se rompe, una corriente que te arrastra) en 2D ilustrado con una persona; lo que casi todos harían falla y lo que de verdad te salva, con física real.
  tono: Directo y con tensión, en segunda persona ("tú"), frases cortas. Primero el miedo, luego el mito que falla y al final la respuesta que salva. Consejos correctos según rescatistas y física; nada de sangre ni heridas.
  formato: supervivencia  # situación → dilema → el mito falla → lo que te salva → caso real → instrucción corta (reglas en .claude/commands/video-sobrevive.md)
  motor: 2d               # escenas con plantilla/sobrevive2d.js (global V) sobre el kit Ilustra
  libs2d: [fauna2d.js, sobrevive2d.js]
  comando: video-sobrevive
  temas: libre            # Claude elige cada tema pensando en viralidad; la lista de ideas es solo de ejemplo
  modelo: sonnet
  final: pregunta
  subtitulos: arriba      # subtítulos arriba, planos, sin borde ni relieve (letras blancas: escenas más oscuras)
  portada_en_video: false # arranca directo en el gancho
  voz: "gemini:Charon"
  auto: false             # desactivado el 2026-11-22: solo se fabrica Sombra de Evidencia (a mano con --nicho sobrevive)
  estilo: ilustracion
  cierre: "¿Tú qué habrías hecho? Escríbelo en los comentarios."
  lema: "¿Sobrevivirías?"
  paleta: {fondo: ["#1b222c", "#262f3b", "#34404f"], acento: "#E0B060", principal: "#EFE6D2", secundario: "#4F6D8F", peligro: "#C9584C", ok: "#6FA66E"}
  ideas:
    # situaciones extremas reales: la fábrica toma una al azar entre las que no se han hecho; al acabarse, Claude elige otras
    - El ascensor que se suelta
    - Te cae un rayo en campo abierto
    - El hielo del lago se rompe bajo tus pies
    - Una corriente de resaca te arrastra mar adentro
    - Tu carro cae a un río
    - Terremoto dentro de un edificio (el mito del triángulo de la vida)
    - Incendio en tu edificio y el pasillo lleno de humo
    - El avión pierde presión y caen las máscaras
    - Los frenos de tu carro fallan en una bajada
    - Una avalancha te alcanza esquiando
    - El mar se retira de golpe en la playa (tsunami)
    - Te atragantas comiendo y estás solo
    - Te muerde una serpiente en el campo
    - Caes al agua helada
    - Un tornado se acerca y estás en la calle
    - Te pierdes en el desierto sin agua
    - "Arenas movedizas: el mito y la verdad"
    - Te quedas encerrado en un carro bajo el sol
    - Te caes de un barco en alta mar
    - Un enjambre de abejas te persigue
    - Te pierdes en el bosque de noche
    - Te sorprende una tormenta eléctrica nadando
    - Un oso pardo te ve en el bosque
    - Un tiburón nada hacia ti en la playa
    - Un perro bravo corre hacia ti
    - Un toro te embiste en el campo
    - Un cocodrilo te agarra en la orilla del río
    - Una manada de lobos te rodea
    - Un puma te acecha en el sendero

estafa:
  nombre: 🚨 Así te estafan
  descripcion: Estafas cotidianas contadas con una persona de verdad (Marta) que cae o casi cae - mensajes, llamadas, códigos, falsos premios -; se ve cómo funciona el truco, la señal que lo delata y lo que te salva. Prevención útil para mandarle a tu mamá.
  tono: Cercano y directo, como un amigo que te avisa antes de que te pase. Frases cortas, tensión al principio, alivio al final. Cero morbo y cero instrucciones para estafar - solo cómo reconocerlo y qué hacer.
  formato: estafa         # truco en marcha → dilema → cómo funciona (qué emoción usa) → la señal que lo delata → qué hacer (reglas en .claude/commands/video-estafa.md)
  personajes: ilustra     # Marta, el estafador y la gente con el kit de ilustración (S30/D: decorados.js, incluye D.celular)
  comando: video-estafa
  cuadros_hoja: 2         # la revisión mira inicio y final de cada escena
  temas: libre            # Claude elige cada tema pensando en viralidad; la lista de ideas es solo de ejemplo
  modelo: sonnet
  final: pregunta         # la última escena es la pregunta para comentar ("¿a quién le mandarías este video?")
  subtitulos: arriba      # subtítulos arriba, planos, sin borde ni relieve
  portada_en_video: false # arranca directo en el gancho
  voz: "gemini:Achird"
  auto: false             # desactivado el 2026-11-22: solo se fabrica Sombra de Evidencia (a mano con --nicho estafa)
  estilo: ilustracion
  cierre: "¿A quién le mandarías este video para que no le pase? Escríbelo en los comentarios."
  lema: "Así te estafan"
  paleta: {fondo: ["#2c3a4e", "#1f2a3a", "#141b27"], acento: "#E0B060", principal: "#EFE6D2", secundario: "#4F6D8F", peligro: "#C9584C", ok: "#6FA66E"}
  ideas:
    # estafas reales y comunes en Latinoamérica: la fábrica toma una al azar entre las que no se han hecho; al acabarse, Claude elige otras
    - El código de WhatsApp que te pide tu amiga
    - La llamada del "banco" que dice que hay un fraude en tu cuenta
    - El mensaje de "tu paquete no pudo entregarse"
    - El familiar que te escribe desde un número nuevo y necesita plata ya
    - El premio que ganaste sin haber jugado
    - El trabajo fácil de dar "me gusta" a cambio de dinero
    - El enlace del "recibo de luz" que vence hoy
    - La inversión que duplica tu dinero en una semana
    - El falso soporte técnico que te pide instalar un programa
    - La compra online con el vendedor que pide pagar por fuera de la plataforma
    - El comprobante de pago falso cuando vendes algo
    - El "secuestro virtual": llaman diciendo que tienen a tu hijo
    - El cajero que "se tragó" tu tarjeta y el desconocido que te ayuda
    - El amor que conociste en línea y necesita dinero para viajar
    - El falso funcionario que te cobra una multa por teléfono
    - El alquiler barato de un apartamento que no existe
    - La oferta de empleo que te pide pagar para empezar
    - El QR falso pegado sobre el real en el restaurante
    - La voz de tu hijo clonada con inteligencia artificial

riesgo:
  nombre: 🎲 ¿Lo arriesgarías?
  descripcion: >-
    Historias REALES de personas famosas y de negocios que lo apostaron todo (despedidos, rechazados, en quiebra, sin dinero para la renta)
    y lo que pasó después, contadas en 35-50 s con una silueta sin rostro, títulos gigantes y un giro que cambia cómo ves al personaje.
    Cierra con un reto que divide los comentarios: «¿tú lo habrías arriesgado todo?». Cada video sale en español y en inglés.
  tono: >-
    Narrador directo y con tensión, frases cortas, números concretos (dólares, años, intentos) y un giro. Admira sin adorar: muestra el
    costo real de arriesgarse y deja que el espectador decida. Todo verificable con fuentes; nada de rumores ni frases inventadas.
  formato: riesgo        # gancho → el riesgo → la caída → el giro → el resultado → la moraleja → el reto (reglas en .claude/commands/video-riesgo.md)
  personajes: ilustra    # silueta sin rostro (S30.hombre con silueta: true) sobre los decorados D
  comando: video-riesgo
  cuadros_hoja: 2
  temas: libre           # Claude elige cada historia con WebSearch; la lista es solo de ejemplo
  herramientas: "WebSearch,WebFetch"   # para verificar cada dato y traer las fuentes
  modelo: sonnet
  final: pregunta        # la última escena es el reto para comentar (la pone el sistema en grande)
  portada_en_video: false
  idiomas: [en]          # además del español, el mismo video en inglés (campo "en" del guion; voz_en = su voz). El inglés paga más por mil vistas
  voz: "gemini:Charon"
  voz_en: "gemini:Charon"
  estilo_voz: "Say at a brisk, lively pace like a gripping short story"   # medido 2026-11-24: con "pausas y suspenso" el mismo texto duraba 60 s en vez de 37
  auto: true
  estilo: ilustracion
  cierre: "¿Tú lo habrías arriesgado todo? Escríbelo en los comentarios."
  lema: "¿Lo arriesgarías?"
  paleta: {fondo: ["#2a1b4d", "#1a1033", "#0d0820"], acento: "#FFD23F", principal: "#FFFFFF", secundario: "#8E7CC3", peligro: "#FF4B3E", ok: "#5BBF7A"}
  ideas:
    # solo ejemplos de la clase de historia (Claude elige y verifica la suya, y no repite las ya hechas)
    - Steve Jobs - lo echaron de Apple y volvió para salvarla
    - James Dyson y sus 5.127 prototipos antes del primer éxito
    - J. K. Rowling - doce editoriales rechazaron Harry Potter
    - Walt Disney - su primera empresa quebró antes de crear a Mickey
    - El coronel Sanders empezó a vender franquicias a los 65 años
    - Airbnb vendía cereales de colección para pagar deudas
    - Netflix ofreció venderse a Blockbuster y se rieron
    - Phil Knight vendía zapatillas desde la cajuela de su auto antes de Nike
    - Sylvester Stallone se negó a vender el guion de Rocky si no lo protagonizaba
    - Oprah Winfrey - la sacaron de su primer puesto en televisión
    - Michael Jordan no entró al equipo principal de su instituto
    - Colgate, Ford o Honda - empresas que estuvieron a punto de desaparecer
