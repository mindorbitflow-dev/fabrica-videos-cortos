# Crea 2 videos (y sus posts) por ejecución, en 3 horarios al día (9:17, 14:17 y 19:17 hora de Colombia): unos 4-6 al día, porque
# GitHub se salta o retrasa parte de las ejecuciones programadas. Los envía por correo. También se lanza a mano: Actions → Fábrica de videos → Run workflow.
name: Fábrica de videos

on:
  schedule:
    # 2 videos por ejecución (decisión del usuario, 2026-11-13): cada uno gasta parte del límite de uso del plan de Claude.
    # Hora UTC: 14, 19 y 0 = 9:17, 14:17 y 19:17 en Colombia (UTC-5). GitHub puede retrasarlas unos minutos o saltarse alguna.
    - cron: "17 0,14,19 * * *"
  workflow_dispatch:
    inputs:
      nicho:
        description: Nicho (rotar = el que lleva más tiempo sin video)
        type: choice
        options: [rotar, evidencia, biologia, cotidiano, ciencia, cuerpo, tecnologia, dinero, mente]
        default: rotar
      cantidad:
        description: Videos en esta ejecución (cada uno por correo)
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write   # guardar state/historial.json para no repetir temas

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # 2 videos: dibujante hasta 50 min + render, cada uno
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"   # ver el avance en vivo en el registro
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # dibujante: token de la suscripción (`claude setup-token`), no es API key
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
      GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
      NICHOS_AUTO: ${{ vars.NICHOS_AUTO }}   # opcional (Settings → Variables), ej: cotidiano,ciencia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: modelos-whisper-base-chromium-v1

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Instalar el dibujante (Claude Code)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''   # sin el token la fábrica usa el método anterior
        run: npm install -g @anthropic-ai/claude-code

      - name: Fabricar y enviar por correo
        run: python run.py --auto --cantidad "${{ inputs.cantidad || 2 }}" --nicho "${{ inputs.nicho || 'rotar' }}"

      - name: Guardar el video en Actions (respaldo, 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            proyectos/*/video.mp4
            proyectos/*/proyecto.json
            proyectos/*/escenas.js
            proyectos/*/post.jpg
            proyectos/*/hojas/*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar historial de temas
        if: always()   # aunque un video falle, los que salieron bien deben quedar en el historial (no repetir temas)
        run: |
          git config user.name "fabrica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/historial.json
          git diff --cached --quiet && exit 0
          git commit -m "Historial: nuevo video"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
