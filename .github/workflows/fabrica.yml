# Dos tandas al día, una para publicar en la mañana y otra en la noche: en cada tanda, un video (y su post) por cada página
# activa. Cada tanda tiene una ejecución de respaldo 1,5 h después que solo hace las páginas que faltan (GitHub se salta o
# retrasa ejecuciones). Los envía por correo. También se lanza a mano: Actions → Fábrica de videos → Run workflow.
name: Fábrica de videos

on:
  schedule:
    # 2 videos al día por página (decisión del usuario, 2026-11-15): uno para la mañana y otro para la noche.
    # Hora UTC → Colombia (UTC-5): 9:17 → 4:17 (mañana) y 20:17 → 15:17 (noche); los de :47 son los respaldos.
    - cron: "17 9 * * *"
    - cron: "47 10 * * *"
    - cron: "17 20 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      nicho:
        description: Nicho (rotar = el que lleva más tiempo sin video)
        type: choice
        options: [todos, rotar, evidencia, sobrevive, estafa, biologia, cotidiano, ciencia, cuerpo, tecnologia, dinero, mente]
        default: rotar
      ejemplo:
        description: Renderizar un ejemplo (ejemplos/NOMBRE) en vez de fabricar, p. ej. estafa
        type: string
        default: ""
      cantidad:
        description: Videos en esta ejecución (cada uno por correo)
        type: choice
        options: ["1", "2", "3"]
        default: "2"

permissions:
  contents: write   # guardar state/historial.json para no repetir temas

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # dibujante hasta 75 min + render (videos de 90-120 s), con margen
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"   # ver el avance en vivo en el registro
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # dibujante: token de la suscripción (`claude setup-token`), no es API key
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
      GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
      NICHOS_AUTO: ${{ vars.NICHOS_AUTO }}   # opcional (Settings → Variables), ej: cotidiano,ciencia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: modelos-whisper-base-chromium-v1

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Instalar el dibujante (Claude Code)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''   # sin el token la fábrica usa el método anterior
        run: npm install -g @anthropic-ai/claude-code

      - name: Fabricar y enviar por correo
        run: |
          if [ -n "${{ inputs.ejemplo }}" ]; then
            python run.py --ejemplo "${{ inputs.ejemplo }}" --correo
          else
            python run.py --auto --cantidad "${{ inputs.cantidad || 2 }}" --nicho "${{ inputs.nicho || 'todos' }}"
          fi

      - name: Guardar el video en Actions (respaldo, 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            proyectos/*/video.mp4
            proyectos/*/proyecto.json
            proyectos/*/escenas.js
            proyectos/*/post.jpg
            proyectos/*/hojas/*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar historial de temas
        if: always()   # aunque un video falle, los que salieron bien deben quedar en el historial (no repetir temas)
        run: python -m src.subir_historial
