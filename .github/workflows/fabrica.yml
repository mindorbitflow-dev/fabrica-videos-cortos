# Crea un video cada 3 horas y lo envía por correo. También se lanza a mano: Actions → Fábrica de videos → Run workflow.
name: Fábrica de videos

on:
  schedule:
    # Cada 3 horas (8 videos al día). Hora UTC: 2,5,8,...,23 UTC = 21:17, 0:17, 3:17, ..., 18:17 en Colombia (UTC-5).
    # GitHub puede retrasar las tareas programadas unos minutos en horas de mucha demanda.
    - cron: "17 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      nicho:
        description: Nicho (rotar = el que lleva más tiempo sin video)
        type: choice
        options: [rotar, biologia, cotidiano, ciencia, cuerpo, tecnologia, dinero, mente]
        default: rotar

permissions:
  contents: write   # guardar state/historial.json para no repetir temas

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"   # ver el avance en vivo en el registro
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
      GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
      NICHOS_AUTO: ${{ vars.NICHOS_AUTO }}   # opcional (Settings → Variables), ej: cotidiano,ciencia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: modelos-whisper-base-chromium-v1

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fabricar y enviar por correo
        run: python run.py --auto --nicho "${{ inputs.nicho || 'rotar' }}"

      - name: Guardar el video en Actions (respaldo, 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            proyectos/*/video.mp4
            proyectos/*/proyecto.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar historial de temas
        if: success()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/historial.json
          git diff --cached --quiet && exit 0
          git commit -m "Historial: nuevo video"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
